      <!-- mustache, narrow and pointed -->
      <path d="M -2 -14 Q -14 -18 -26 -12 Q -34 -8 -40 -14 Q -44 -18 -40 -24" fill="none" stroke-width="5"/>
      <path d="M 2 -14 Q 14 -18 26 -12 Q 34 -8 40 -14 Q 44 -18 40 -24" fill="none" stroke-width="5"/>

      <!-- BIG happy open smile -->
      <path d="M -20 -8 Q 0 16 20 -8 Q 12 6 0 6 Q -12 6 -20 -8 Z" fill="#7A2424" stroke-width="4"/>
      <path d="M -14 -6 Q 0 4 14 -6 Q 0 -1 -14 -6 Z" fill="#FFFFFF" stroke-width="1.5"/>

      <!-- rosy cheeks -->
      <ellipse cx="-32" cy="-14" rx="8" ry="6" fill="#EDA98F" opacity="0.6" stroke="none"/>
      <ellipse cx="32" cy="-14" rx="8" ry="6" fill="#EDA98F" opacity="0.6" stroke="none"/>
