      <path d="M -52 40 Q -70 60 -68 105 Q -66 140 -30 150 Q 0 156 32 150 Q 66 142 66 105 Q 68 58 50 40 Q 24 56 0 56 Q -26 56 -52 40 Z" fill="#FFFFFF" stroke-width="5.5"/>

