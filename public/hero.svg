      <path d="M -8 -41 L -8 -20 L -24 5 L -24 55 Q -24 62 -17 62 L 17 62 Q 24 62 24 55 L 24 5 L 8 -20 L 8 -41 Z" fill="#7A2424"/>
      <path d="M -24 8 L 24 8 L 24 55 Q 24 62 17 62 L -17 62 Q -24 62 -24 55 Z" fill="#5C1B1B"/>
      <ellipse cx="0" cy="30" rx="16" ry="20" fill="#F97316" opacity="0.95"/>
