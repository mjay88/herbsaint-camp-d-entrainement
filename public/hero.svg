      <path d="M -18 24 Q -30 34 -22 52 Q -16 66 0 60 Q 8 56 6 44 Q 4 32 -6 26 Q -12 22 -18 24 Z" fill="#E63329" stroke-width="4.5"/>
      <path d="M 16 24 Q 28 32 22 50 Q 16 64 2 58 Q -6 52 -2 40 Q 2 30 10 26 Q 13 24 16 24 Z" fill="#E63329" stroke-width="4.5"/>
      <ellipse cx="-1" cy="30" rx="12" ry="9" fill="#E63329" stroke-width="4.5"/>

      <!-- neck -->
      <rect x="-13" y="12" width="26" height="20" rx="8" fill="#F3C7B4" stroke-width="4"/>

      <!-- ears -->
      <ellipse cx="-46" cy="-24" rx="11" ry="14" fill="#F3C7B4" stroke-width="4"/>
      <ellipse cx="46" cy="-24" rx="11" ry="14" fill="#F3C7B4" stroke-width="4"/>

      <!-- head -->
      <path d="M -50 -30 Q -56 -66 -26 -82 Q 0 -96 26 -82 Q 56 -66 50 -30 Q 48 -2 26 12 Q 0 24 -26 12 Q -48 -2 -50 -30 Z" fill="#F3C7B4" stroke-width="5.5"/>

      <!-- tall poofy chef hat -->
      <path d="M -40 -76 Q -56 -100 -44 -128 Q -36 -146 -18 -152 Q -22 -168 -6 -178 Q 8 -186 20 -176 Q 32 -168 26 -152 Q 42 -148 50 -130 Q 58 -110 44 -90 Q 54 -82 48 -68 Q 42 -56 24 -60 Q 0 -66 -22 -62 Q -40 -60 -46 -68 Q -50 -76 -40 -76 Z" fill="#FFFFFF" stroke-width="5.5"/>
      <path d="M -46 -68 Q -22 -62 0 -66 Q 24 -60 48 -68 Q 50 -56 40 -50 Q 20 -42 0 -44 Q -22 -42 -40 -50 Q -48 -56 -46 -68 Z" fill="#FFFFFF" stroke-width="4.5"/>

      <!-- eyebrows, happy/raised -->
